name: Build Bonjee Notifier APK

# Builds the Android APK in the cloud so no Android Studio or local SDK is needed.
# Download the APK from the run's "Artifacts" section.

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/android-notifier/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: apps/android-notifier
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bonjee-notifier-debug-apk
          path: apps/android-notifier/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
