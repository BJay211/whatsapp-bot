plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bonjee.notifier'
    compileSdk 34

    defaultConfig {
        applicationId "com.bonjee.notifier"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "2.7"

        buildConfigField "String", "DEFAULT_N8N_BASE_URL", "\"https://bonjee-n8n.onrender.com\""
        buildConfigField "String", "DEFAULT_NOTIFICATION_PATH", "\"/webhook/notifications-ingest\""
        buildConfigField "String", "DEFAULT_ASK_PATH", "\"/webhook/personal-ai-ask\""
        buildConfigField "String", "DEFAULT_DASHBOARD_URL", "\"https://bonjee-dashboard.onrender.com\""
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Debug signing so `assembleRelease` still produces an installable APK
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // The release APK is debug-signed for sideloading, so a full lint gate is not
    // useful here and only slows down (or blocks) offline builds.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
}
