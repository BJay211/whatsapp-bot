# Render Blueprint for Bonjee Bot
# This will create all services with one click (after setting env vars)

services:
  # Evolution API - WhatsApp connection
  - type: web
    name: bonjee-evolution
    runtime: image
    plan: starter
    image:
      url: docker.io/evolutionapi/evolution-api:latest
    disk:
      name: evolution-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_URL
        fromService:
          type: web
          name: bonjee-evolution
          property: host
        format: https://%s
      - key: DATABASE_URL
        fromDatabase:
          name: bonjee-db
          property: connectionString
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: CORS_METHODS
        value: "GET,POST,PUT,DELETE"
      - key: CORS_CREDENTIALS
        value: "true"
      - key: DEL_INSTANCE
        value: "false"

  # n8n - Orchestration
  - type: web
    name: bonjee-n8n
    runtime: docker
    plan: starter
    image:
      url: docker.n8n.io/n8nio/n8n:latest
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1
    envVars:
      - key: PORT
        value: 5678
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: GENERIC_TIMEZONE
        value: UTC
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: bonjee-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: bonjee-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: bonjee-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: bonjee-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: bonjee-db
          property: password
      - key: WEBHOOK_URL
        fromService:
          type: web
          name: bonjee-n8n
          property: host
        format: https://%s/
      - key: N8N_EDITOR_BASE_URL
        fromService:
          type: web
          name: bonjee-n8n
          property: host
        format: https://%s/
      - key: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: all
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: all
      - key: EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS
        value: true

  # Next.js Dashboard (Bonjee OS web cockpit)
  - type: web
    name: bonjee-dashboard
    runtime: node
    plan: starter
    rootDir: apps/dashboard
    # `next build` needs devDependencies, and NODE_ENV=production would skip
    # them on a plain `npm install`, so include dev explicitly.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bonjee-db
          property: connectionString
      - key: N8N_BASE_URL
        fromService:
          type: web
          name: bonjee-n8n
          property: host
        format: https://%s
      - key: EVOLUTION_API_URL
        value: https://evolution-api-rqy3.onrender.com
      - key: EVOLUTION_INSTANCE
        value: whatsapp bot
      # Paste the Evolution AUTHENTICATION_API_KEY in the Render dashboard.
      - key: EVOLUTION_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://hwpfxpfcixkykqpsiohi.supabase.co
      # Public key only. Never put the sb_secret_ service key in a client app.
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Fill this in the Render dashboard to lock the cockpit behind a passphrase.
      - key: DASHBOARD_PASSPHRASE
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: bonjee-dashboard
          property: host
        format: https://%s

databases:
  - name: bonjee-db
    plan: starter
    databaseName: bonjee
    user: bonjee_user
