services:
  - type: web
    name: n8n-service
    env: docker
    plan: free
    dockerfilePath: ./n8n.Dockerfile
    envVars:
      - key: N8N_HOST
        value: n8n-service.onrender.com
      - key: WEBHOOK_URL
        value: https://n8n-service.onrender.com/
      - key: N8N_ENCRYPTION_KEY
        value: bjay_secure_key_2026

  - type: web
    name: evolution-api
    env: docker
    plan: free
    dockerfilePath: ./evolution.Dockerfile
    envVars:
      - key: AUTHENTICATION_API_KEY
        value: 123456
      - key: DATABASE_TYPE
        value: postgres
      - key: DATABASE_ENABLED
        value: "false"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"